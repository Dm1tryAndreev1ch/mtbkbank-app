name: MTBank CI

on:
  push:
    branches: [main, 'gsd/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# Cancel previous run for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # CI-01: paths-filter — determines which jobs run
  # fetch-depth: 0 required so dorny/paths-filter can diff against base branch
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile:  ${{ steps.filter.outputs.mobile }}
      admin:   ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            mobile:
              - 'mobile/**'
            admin:
              - 'admin/**'

  # ─────────────────────────────────────────────────────────────────────────
  # CI-02: Backend — lint + migrate + jest + regression-guard
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend — lint / test / regression-guard"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtbank_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mtbank_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mtbank_test

      - name: Jest
        run: npm test -- --ci --forceExit --coverage --coverageReporters=text-summary
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mtbank_test
          REDIS_URL: redis://localhost:6380
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          NODE_ENV: test

      # CI-02: regression-guard — fails if any forbidden pattern found
      - name: Regression guard
        run: bash scripts/regression-guard.sh

  # ─────────────────────────────────────────────────────────────────────────
  # CI-03: Mobile — tsc + jest
  # ─────────────────────────────────────────────────────────────────────────
  mobile:
    name: "Mobile — tsc / jest"
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript — noEmit
        run: npx tsc --noEmit

      - name: Jest
        run: npx jest --ci --forceExit
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────
  # CI-04: Admin — vitest + build (+ optional Sentry sourcemap upload)
  # ─────────────────────────────────────────────────────────────────────────
  admin:
    name: "Admin — vitest / build"
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Vitest
        run: npx vitest run

      - name: Build production bundle
        run: npm run build
        env:
          # Sentry sourcemap upload is gated on secret presence (CI-04)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload admin dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # CI-01: Aggregator — single required check for branch protection on main.
  # Treats skipped jobs (path not changed) as success.
  # ─────────────────────────────────────────────────────────────────────────
  ci-ok:
    name: "CI OK (branch protection gate)"
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, mobile, admin]
    steps:
      - name: Check all required jobs
        run: |
          FAILED=0
          for job in backend mobile admin; do
            result=$(echo '${{ toJSON(needs) }}' | python3 -c "
import sys, json
needs = json.load(sys.stdin)
result = needs.get('$job', {}).get('result', 'skipped')
print(result)
")
            echo "$job → $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "❌ $job failed"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "Pipeline FAILED."
            exit 1
          fi
          echo "✅ All required checks passed (skipped = path unchanged)."
