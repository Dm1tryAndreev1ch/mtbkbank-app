name: MTBank CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────
  # 1. BACKEND — unit tests
  # ─────────────────────────────────────────────
  backend-test:
    name: "Backend — Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --ci --forceExit --reporters=default

  # ─────────────────────────────────────────────
  # 2. MOBILE — TypeScript check
  # ─────────────────────────────────────────────
  mobile-typecheck:
    name: "Mobile — TypeScript Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # npm install (не ci) — синхронизирует lock-файл если package.json
      # был обновлён вручную без запуска npm install локально
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript compiler check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # 3. MOBILE — Expo Doctor (конфигурация Expo)
  # ─────────────────────────────────────────────
  mobile-expo-doctor:
    name: "Mobile — Expo Doctor"
    runs-on: ubuntu-latest
    needs: mobile-typecheck
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Doctor
        run: npx expo-doctor@latest
        # Не блокируем pipeline при предупреждениях (только при ошибках)
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 4. BACKEND — безопасность зависимостей
  # ─────────────────────────────────────────────
  backend-audit:
    name: "Backend — Security Audit"
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high
        # Предупреждения не блокируют, только high+ уязвимости
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 5. Summary — итоговый статус
  # ─────────────────────────────────────────────
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [ backend-test, mobile-typecheck, mobile-expo-doctor, backend-audit ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.mobile-typecheck.result }}" != "success" ]; then
            echo "❌ Mobile TypeScript check failed"
            exit 1
          fi
          echo "✅ All required checks passed"
          echo "   backend-test:       ${{ needs.backend-test.result }}"
          echo "   mobile-typecheck:   ${{ needs.mobile-typecheck.result }}"
          echo "   mobile-expo-doctor: ${{ needs.mobile-expo-doctor.result }} (advisory)"
          echo "   backend-audit:      ${{ needs.backend-audit.result }} (advisory)"
